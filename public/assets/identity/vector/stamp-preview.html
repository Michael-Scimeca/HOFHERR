<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hofherr Butcher Steer SVG Stamps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e9dec9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .header {
      text-align: center;
      background: #fbf7ee;
      padding: 24px;
      border: 3px solid #6b070b;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    h1 {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: #6b070b;
      margin-bottom: 6px;
    }
    p {
      color: #8b6b3e;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .card {
      background: #fbf7ee;
      border: 2px solid #d98a16;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card h2 {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 22px;
      color: #6b070b;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .card-caption {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 20px;
    }
    .img-wrap {
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      padding: 16px;
      overflow: hidden;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hofherr Meat Co. · Butcher Steer SVG Stamps</h1>
      <p>Vectorized from Gemini Nano Banana Generation</p>
    </div>

    <div class="grid">
      <!-- Card 1: Circular Guild Stamp -->
      <div class="card">
        <h2>Butcher Guild Rubber Stamp</h2>
        <div class="card-caption">Complete round stamp with arched typography and star insignia</div>
        <div class="img-wrap">
          <img src="/assets/identity/vector/hofherr-butcher-guild-stamp.svg" alt="Hofherr Butcher Guild Stamp" />
        </div>
      </div>

      <!-- Card 2: Isolated Woodcut Steer Stamp -->
      <div class="card">
        <h2>Isolated Steer Cut Stamp</h2>
        <div class="card-caption">Pure vector steer with white cut labels and engraved woodcut hatching</div>
        <div class="img-wrap">
          <img src="/assets/identity/vector/hofherr-steer-stamp-isolated.svg" alt="Hofherr Steer Cut Stamp" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
